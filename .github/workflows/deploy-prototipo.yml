name: Publicar prototipo ESEJUR en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "04-DISENO-UX-UI/PROTOTIPO HTML/**"
      - ".github/workflows/deploy-prototipo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Evitar procesamiento Jekyll
        run: touch "04-DISENO-UX-UI/PROTOTIPO HTML/.nojekyll"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el prototipo como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "04-DISENO-UX-UI/PROTOTIPO HTML"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
