    <g id="Badge-En-Vivo" transform="translate(119 330)"><rect width="90" height="28" rx="14" fill="#B9382A"/><text x="45" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="white">• En vivo</text></g>
    <g id="Badge-Hibrido" transform="translate(221 330)"><rect width="88" height="28" rx="14" fill="#6941C6"/><text x="44" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="white">• Híbrido</text></g>
