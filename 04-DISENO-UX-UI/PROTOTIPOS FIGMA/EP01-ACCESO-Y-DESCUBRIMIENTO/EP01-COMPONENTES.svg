    <g id="Acordeon-Modulo" transform="translate(510 110)"><rect width="458" height="64" rx="8" fill="white" stroke="#D0D5DD"/><text x="18" y="28" font-size="14" font-weight="600" fill="#101828">Módulo 1 · Introducción</text><text x="18" y="49" font-size="12" fill="#667085">Contenido del curso · HU-007</text><path d="m420 28 6 6 6-6" fill="none" stroke="#344054" stroke-width="2"/></g>
