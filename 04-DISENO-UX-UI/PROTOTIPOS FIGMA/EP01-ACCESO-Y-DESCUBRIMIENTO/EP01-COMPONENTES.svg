    <text x="24" y="38" font-size="20" font-weight="700" fill="#101828">09 / Ejemplo de composición · barra de búsqueda</text>
    <g id="Busqueda-Compuesta" transform="translate(24 68)"><rect width="1456" height="92" rx="12" fill="#F8FAFC" stroke="#EAECF0"/><g id="Busqueda-Input" transform="translate(20 22)"><rect width="700" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="16" y="30" font-size="16" fill="#667085">Busca por título o descripción del curso</text></g><g id="Busqueda-Boton" transform="translate(736 22)"><rect width="116" height="48" rx="8" fill="#006F73"/><text x="58" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="white">Buscar</text></g><g id="Busqueda-Tipo" transform="translate(876 22)"><rect width="260" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="16" y="30" font-size="14" fill="#344054">Todos los tipos</text><path d="m230 21 6 6 6-6" fill="none" stroke="#344054" stroke-width="2"/></g></g>
