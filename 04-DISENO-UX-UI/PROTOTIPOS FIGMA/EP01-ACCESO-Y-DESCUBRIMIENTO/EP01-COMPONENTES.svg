    <text x="24" y="38" font-size="20" font-weight="700" fill="#101828">03 / Campos de formulario</text>
    <text x="24" y="65" font-size="12" fill="#667085">HU-001 a HU-005 · altura de control 48 px</text>
    <g id="Input-Vacio" transform="translate(24 88)"><text font-size="14" fill="#344054">Correo electrónico</text><rect y="12" width="432" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="14" y="42" font-size="16" fill="#667085">nombre@entidad.gob.pe</text></g>
    <g id="Input-Foco" transform="translate(24 181)"><text font-size="14" fill="#344054">Nombres</text><rect x="-3" y="9" width="438" height="54" rx="10" fill="none" stroke="#A6F4F4" stroke-width="3"/><rect y="12" width="432" height="48" rx="8" fill="white" stroke="#006F73"/><text x="14" y="42" font-size="16" fill="#101828">Lucía Beatriz</text><path d="M116 26v22" stroke="#101828"/></g>
    <g id="Input-Error" transform="translate(24 273)"><text font-size="14" fill="#344054">Correo electrónico</text><rect y="12" width="432" height="48" rx="8" fill="white" stroke="#B42318"/><text x="14" y="42" font-size="16" fill="#101828">lucia@</text><text y="82" font-size="12" fill="#B42318">Ingresa un correo electrónico válido.</text></g>
    <text x="24" y="393" font-size="12" fill="#667085">Etiqueta siempre visible; el placeholder no la sustituye.</text>
  </g>
  <g id="04-Contrasena-y-verificacion" transform="translate(1072 496)" font-family="Inter,Arial,sans-serif">
    <rect width="480" height="420" rx="16" fill="#FFFFFF" stroke="#EAECF0"/>
    <text x="24" y="38" font-size="20" font-weight="700" fill="#101828">04 / Acceso y verificación</text>
    <text x="24" y="65" font-size="12" fill="#667085">HU-001, HU-002, HU-003 y HU-004</text>
    <g id="Input-Contrasena" transform="translate(24 88)"><text font-size="14" fill="#344054">Crear contraseña</text><rect y="12" width="332" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="14" y="42" font-size="16" fill="#667085">Mínimo 8 caracteres</text><g id="Boton-Mostrar" transform="translate(340 12)"><rect width="92" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="46" y="30" text-anchor="middle" font-size="14" fill="#103860">Mostrar</text></g></g>
    <g id="Requisitos-Contrasena" transform="translate(24 175)" font-size="12" fill="#475467"><text>○ Al menos 8 caracteres</text><text x="230">○ Una letra mayúscula</text><text y="25">○ Una letra minúscula</text><text x="230" y="25">○ Al menos un número</text></g>
    <g id="Codigo-Verificacion" transform="translate(24 240)"><text font-size="14" fill="#344054">Código de verificación</text><rect y="12" width="432" height="56" rx="8" fill="white" stroke="#D0D5DD"/><text x="216" y="48" text-anchor="middle" font-size="24" letter-spacing="12" fill="#667085">000000</text></g>
    <g id="Enlace-Reenviar" transform="translate(24 349)"><text font-size="14" fill="#475467">¿No te llegó?</text><text x="98" font-size="14" fill="#1F5F8B">Reenviar código</text></g>
    <text x="24" y="390" font-size="12" fill="#667085">Un campo de código; no seis inputs independientes.</text>
  </g>
  <g id="05-Seleccion-y-perfil" transform="translate(48 940)" font-family="Inter,Arial,sans-serif">
    <rect width="480" height="420" rx="16" fill="#FFFFFF" stroke="#EAECF0"/>
    <text x="24" y="38" font-size="20" font-weight="700" fill="#101828">05 / Selección y perfil</text>
    <g id="Select-Categoria" transform="translate(24 80)"><text font-size="14" fill="#344054">Categoría temática</text><rect y="12" width="432" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="14" y="42" font-size="16" fill="#101828">Todos</text><path d="m403 32 6 6 6-6" fill="none" stroke="#344054" stroke-width="2"/></g>
    <g id="Checkbox-Sin-Marcar" transform="translate(24 168)"><rect width="20" height="20" rx="4" fill="white" stroke="#98A2B3"/><text x="32" y="16" font-size="14" fill="#344054">He leído y acepto los términos del servicio</text></g>
    <g id="Checkbox-Marcado" transform="translate(24 210)"><rect width="20" height="20" rx="4" fill="#103860"/><path d="m5 10 3 3 7-7" fill="none" stroke="white" stroke-width="2"/><text x="32" y="16" font-size="14" fill="#344054">He leído y acepto la política de privacidad</text></g>
    <g id="Input-Opcional" transform="translate(24 280)"><text font-size="14" fill="#344054">Teléfono/Celular</text><rect x="348" y="-15" width="84" height="20" rx="10" fill="#D9FAFA"/><text x="390" y="-1" text-anchor="middle" font-size="10" font-weight="600" fill="#006F73">OPCIONAL</text><rect y="12" width="432" height="48" rx="8" fill="white" stroke="#D0D5DD"/><text x="14" y="42" font-size="16" fill="#667085">999 999 999</text></g>
    <text x="24" y="389" font-size="12" fill="#667085">Filtros mediante selectores, no etiquetas seleccionables.</text>
  </g>
