<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1870" viewBox="0 170 1600 1870">
  <title>ESEJUR · Componentes de la Epica 1</title>
  <desc>Hoja de piezas vectoriales agrupadas: acceso, registro, verificacion, recuperacion, perfil, catalogo y ficha del curso. Basada en el HTML principal y la guia de componentes. Estados ilustrativos; no incluye funcionalidad, Auto Layout ni variantes nativas de Figma. Tipografias Inter y Merriweather.</desc>
  <rect width="1600" height="2040" fill="#F2F4F7"/>
