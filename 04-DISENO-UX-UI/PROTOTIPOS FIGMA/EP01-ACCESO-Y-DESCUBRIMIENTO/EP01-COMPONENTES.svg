      <g id="Curso-Modalidad" transform="translate(16 16)"><rect width="84" height="26" rx="13" fill="#006F73"/><text x="42" y="18" text-anchor="middle" font-size="12" fill="white">• Virtual</text></g>
      <g id="Curso-Categoria"><text x="20" y="215" font-size="11" font-weight="700" fill="#C83E4D">DIPLOMADO · DERECHO REGISTRAL</text></g>
      <g id="Curso-Titulo" font-size="20" font-weight="700" fill="#101828"><text x="20" y="250">Diplomado en Derecho</text><text x="20" y="278">Registral y Notarial</text></g>
      <g id="Curso-Docentes"><circle cx="34" cy="312" r="14" fill="#D9FAFA"/><text x="34" y="316" text-anchor="middle" font-size="10" fill="#006F73">MC</text><text x="58" y="317" font-size="12" fill="#667085">Dra. Mariela Cárdenas Ruiz</text></g>
      <g id="Curso-Duracion"><text x="20" y="355" font-size="14" fill="#667085">120 horas académicas</text></g>
      <g id="Curso-Precio"><text x="20" y="398" font-size="14" fill="#98A2B3" text-decoration="line-through">S/ 650.00</text><text x="20" y="430" font-size="24" font-weight="700" fill="#101828">S/ 450.00</text></g>
      <g id="Curso-Disponibilidad" transform="translate(235 407)"><rect width="130" height="24" rx="12" fill="#ECFDF3"/><text x="65" y="17" text-anchor="middle" font-size="11" fill="#027A48">Inicio inmediato</text></g>
      <g id="Curso-Boton-Detalle" transform="translate(20 463)"><rect width="344" height="48" rx="8" fill="#103860"/><text x="172" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="white">Ver detalles</text></g>
