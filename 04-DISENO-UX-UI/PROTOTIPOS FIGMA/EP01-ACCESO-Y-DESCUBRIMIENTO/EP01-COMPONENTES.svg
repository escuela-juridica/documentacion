    <g id="Color-Borde" transform="translate(544 62)"><rect width="88" height="54" rx="8" fill="#D0D5DD"/><text y="76" font-size="12" fill="#475467">#D0D5DD</text></g>
    <text x="24" y="190" font-size="14" fill="#475467">Inter · interfaz / Merriweather · títulos editoriales</text>
    <text x="24" y="220" font-size="13" fill="#667085">Espaciado 8 · 16 · 24 · 32 / radios 8 · 12 · 16 px</text>
    <g id="Tipografia-Titulo" transform="translate(710 60)"><text y="30" font-size="32" font-weight="700" fill="#101828">Crear mi cuenta</text><text y="55" font-size="12" fill="#667085">Inter · 32 px · negrita</text></g>
    <g id="Tipografia-Editorial" transform="translate(710 136)"><text y="30" font-family="Merriweather,Georgia,serif" font-size="30" font-weight="700" fill="#103860">Formación jurídica especializada</text></g>
    <g id="Tipografia-Cuerpo" transform="translate(710 209)"><text font-size="16" fill="#475467">Ingresa para continuar tus cursos.</text><text y="27" font-size="12" fill="#667085">Texto auxiliar · indicaciones de campos y estados</text></g>
  </g>
