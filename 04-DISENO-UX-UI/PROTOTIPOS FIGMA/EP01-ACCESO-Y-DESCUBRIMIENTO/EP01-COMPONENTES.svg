    <text x="24" y="667" font-size="12" fill="#667085">La portada es un slot, no una fotografía exportada.</text>
    <text x="24" y="691" font-size="12" fill="#667085">Textos y precios: ejemplo del catálogo del prototipo.</text>
  </g>
